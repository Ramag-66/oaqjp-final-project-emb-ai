<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emotion Detector</title>
<style>body{font:16px system-ui,sans-serif;max-width:720px;margin:4rem auto;padding:0 1rem;color:#222}textarea{width:100%;min-height:120px;padding:12px;box-sizing:border-box}button{background:#4b52b8;color:white;border:0;border-radius:6px;padding:12px 18px;margin-top:12px;cursor:pointer}#result{margin-top:24px;white-space:pre-wrap}</style></head>
<body><h1>Emotion Detector</h1><label for="text">Enter text to analyze</label><textarea id="text" placeholder="I love this new technology."></textarea><button id="analyze">Analyze emotion</button><div id="result" role="status"></div>
<script>document.getElementById('analyze').addEventListener('click',async()=>{const result=document.getElementById('result');result.textContent='Analyzing…';try{const text=document.getElementById('text').value;const response=await fetch('/emotionDetector?textToAnalyze='+encodeURIComponent(text));result.textContent=await response.text();}catch(error){result.textContent='Unable to analyze text: '+error.message;}});</script>
</body></html>
